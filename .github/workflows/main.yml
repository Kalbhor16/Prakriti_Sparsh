name: Node CI

on: 
  push: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
    
